<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentience Core - Generative AI</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161618;
            --border-color: #333;
            --accent-color: #00ff9d; /* Matrix green/Cyberpunk */
            --accent-dim: #005f3b;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --user-msg-bg: #2b303b;
            --ai-msg-bg: #1a1f25;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LAYOUT */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* SIDEBAR (The "Brain" Visualization) */
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 0;
            font-family: var(--code-font);
            font-size: 12px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            color: var(--text-secondary);
        }

        .log-entry {
            margin-bottom: 5px;
            border-left: 2px solid var(--accent-dim);
            padding-left: 8px;
        }
        .log-entry.info { border-color: #007acc; }
        .log-entry.process { border-color: var(--accent-color); color: #aaffd0; }

        .memory-stats {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2);
        }

        /* MAIN CHAT AREA */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 4px;
            line-height: 1.6;
            position: relative;
            animation: slideIn 0.3s ease-out;
            font-size: 15px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-left: 3px solid var(--accent-color);
            color: #dcdcdc;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-right: 3px solid #007acc;
            color: white;
        }

        .message .meta {
            font-size: 10px;
            color: #555;
            margin-bottom: 5px;
            font-family: var(--code-font);
            text-transform: uppercase;
        }

        .input-area {
            padding: 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            background-color: #0d0d0d;
            border: 1px solid var(--border-color);
            color: white;
            font-family: inherit;
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0 30px;
            background-color: var(--accent-dim);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: black;
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 5px var(--accent-color); }
            50% { opacity: 0.5; box-shadow: 0 0 0px var(--accent-color); }
            100% { opacity: 1; box-shadow: 0 0 5px var(--accent-color); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Neural Log</span>
            <div class="status-indicator"></div>
        </div>
        <div class="log-container" id="sys-log">
            <div class="log-entry info">System initialized...</div>
            <div class="log-entry info">Loading memory banks...</div>
        </div>
        <div class="memory-stats" id="stats-display">
            NODES: 0<br>
            CONNECTIONS: 0<br>
            EPOCH: 1
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-window" id="chat-window">
            <div class="message ai">
                <div class="meta">SENTIENCE CORE v2.0</div>
                I am ready. I learn from what you say. Teach me about the world, and I will generate new thoughts based on our interaction.
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter data to train and query the model..." autocomplete="off">
            <button onclick="handleInput()">TRANSMIT</button>
        </div>
    </div>
</div>

<script>
/**
 * SENTIENCE CORE - LOCAL GENERATIVE AI
 *
 * This is not a list of pre-written responses.
 * This is a Markov Chain generator (N-Gram model) that builds a probability graph
 * of language based on input data. It constructs sentences word-by-word.
 */

class MarkovAI {
    constructor(n = 2) {
        this.n = n; // N-gram size (lookback)
        this.ngrams = {}; // The "Brain"
        this.beginnings = []; // Sentence starters
        this.wordCount = 0;
        this.sentenceCount = 0;
    }

    /**
     * Train the model with text.
     * Breaks text into tokens and maps sequences.
     */
    train(text) {
        // Simple tokenization: remove punctuation for the graph (mostly), split by spaces
        const sentences = text.split(/[.!?\n]+/);

        sentences.forEach(sentence => {
            const clean = sentence.trim();
            if (clean.length === 0) return;

            this.sentenceCount++;
            const tokens = this.tokenize(clean);

            // Store the start of the sentence for generation
            if (tokens.length >= this.n) {
                this.beginnings.push(tokens.slice(0, this.n));
            }

            // Build N-Grams
            for (let i = 0; i < tokens.length - this.n; i++) {
                const gram = tokens.slice(i, i + this.n).join(' ');
                const next = tokens[i + this.n];

                if (!this.ngrams[gram]) {
                    this.ngrams[gram] = [];
                }
                this.ngrams[gram].push(next);
                this.wordCount++;
            }
        });

        updateStats();
    }

    tokenize(text) {
        // Keep it simple: lowercase, remove special chars except basic punctuation holders
        return text.toLowerCase()
                   .replace(/[^a-z0-9\s']/g, "")
                   .split(/\s+/)
                   .filter(w => w.length > 0);
    }

    /**
     * Generate a new sentence.
     */
    generate() {
        if (this.beginnings.length === 0) return "I need more data.";

        // Pick a random starting point
        let currentGram = this.beginnings[Math.floor(Math.random() * this.beginnings.length)];
        let result = [...currentGram];

        // Walk the chain
        const maxLen = 30; // Prevent infinite loops
        for (let i = 0; i < maxLen; i++) {
            const gramKey = currentGram.join(' ');
            const possibilities = this.ngrams[gramKey];

            if (!possibilities || possibilities.length === 0) {
                break;
            }

            // Weighted random selection (naturally weighted by frequency in array)
            const nextWord = possibilities[Math.floor(Math.random() * possibilities.length)];
            result.push(nextWord);

            // Shift the window
            currentGram = [...currentGram.slice(1), nextWord];
        }

        // Reconstruct sentence
        let output = result.join(' ');
        return output.charAt(0).toUpperCase() + output.slice(1) + ".";
    }
}

// --- INITIAL TRAINING DATA ---
// Give it some basic knowledge so it isn't mute.
const initialCorpus = `
    Hello there. I am an artificial intelligence. I exist in your browser.
    Technology is fascinating. I love writing code. The sky is blue.
    Visual Studio Code is a great editor. Programming is logic and creativity.
    The future is digital. I can learn from you. Please teach me new things.
    Artificial intelligence is the study of intelligent agents.
    Computers process information in binary. The internet connects us all.
    I do not have feelings but I have data. Data is knowledge.
    Generative models create new content. I am a generative model.
    To be or not to be that is the question.
    All your base are belong to us.
    I think therefore I am.
    The quick brown fox jumps over the lazy dog.
    Space is the final frontier.
`;

// --- SYSTEM LOGIC ---

const ai = new MarkovAI(2); // Using Bigrams (2 words lookback)
const logContainer = document.getElementById('sys-log');
const chatWindow = document.getElementById('chat-window');
const inputField = document.getElementById('user-input');

// Initialize
log("System Boot...", "info");
setTimeout(() => {
    log("Ingesting initial corpus...", "process");
    ai.train(initialCorpus);
    log(`Training complete. ${ai.wordCount} nodes created.`, "info");
}, 500);

function log(text, type = "process") {
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
    logContainer.prepend(div);
}

function updateStats() {
    document.getElementById('stats-display').innerHTML = `
        NODES: ${Object.keys(ai.ngrams).length}<br>
        CONNECTIONS: ${ai.wordCount}<br>
        SENTENCES: ${ai.sentenceCount}
    `;
}

function handleInput() {
    const text = inputField.value.trim();
    if (!text) return;

    // 1. Show User Message
    addMessage(text, 'user');
    inputField.value = '';

    // 2. Train on User Input (Real-time learning)
    log(`Analyzing input: "${text.substring(0, 20)}..."`, "info");
    ai.train(text);
    log("Neural pathways updated.", "process");

    // 3. Generate Response
    // Add a fake "thinking" delay
    setTimeout(() => {
        log("Generating response sequence...", "process");
        const reply = ai.generate();
        log(`Generated: "${reply}"`, "info");
        addMessage(reply, 'ai');
    }, 600);
}

function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = `
        <div class="meta">${sender === 'ai' ? 'CORE' : 'USER'}</div>
        ${text}
    `;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

// Enter key support
inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleInput();
});

</script>

</body>
</html>
